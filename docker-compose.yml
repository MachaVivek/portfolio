# Runs the whole stack — backend and client — with one command:
#
#     docker compose up --build
#
# For day-to-day client work: `cd client && npm run dev`
# For backend-only work: `cd backend && docker compose up`

services:
  backend:
    build: ./backend
    ports:
      - "8002:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  client:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      # "backend" is the service name above — inside the compose network that
      # resolves to the backend container.
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
